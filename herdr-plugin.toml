id = "wataru-toriumi.factory-board"
name = "Factory Board"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Run manual and scheduled Codex or Claude Code tasks from a workspace board."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "open-board"
title = "Factory Board を開く"
command = ["sh", "-c", 'exec "$HERDR_BIN_PATH" plugin pane open --plugin "$HERDR_PLUGIN_ID" --entrypoint board']

[[panes]]
id = "board"
title = "Factory Board"
command = ["./factory-board"]

[[panes]]
id = "scheduler"
title = "Factory Board Scheduler"
placement = "tab"
command = ["./factory-board", "scheduler"]

[[panes]]
id = "worker"
title = "Factory Board Worker"
placement = "tab"
command = ["./factory-board", "worker"]
